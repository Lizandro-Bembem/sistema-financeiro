<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sistema Financeiro - Família Bembem</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#5d4037">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Financeiro">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root{--m1:#3e2723;--m2:#5d4037;--bg:#fbf5ec;--card:#fff;--bd:#d7ccc8;--ok:#2e7d32;--no:#c62828}
        *{box-sizing:border-box}
        body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--m1);padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
        header{background:var(--m2);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;display:flex;align-items:center;gap:10px}
        header img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #fff}
        header h1{font-size:17px;margin:0}
        main{max-width:640px;margin:0 auto;padding:16px}
        .tela{display:none}.tela.on{display:block}
        .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
        .saldo{background:var(--m1);color:#fff}
        .saldo small{opacity:.8}.saldo .v{font-size:30px;margin:6px 0;display:flex;align-items:center;gap:10px}
        .saldo button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
        .res{display:flex;gap:10px}.res div{flex:1;font-size:13px}.res b{display:block;font-size:16px}
        .rec{color:#a5d6a7}.des{color:#ef9a9a}
        label{display:block;font-size:13px;margin:10px 0 4px}
        input,select{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font-size:16px;font-family:inherit;background:#fff}
        .btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--m2);color:#fff;font-size:16px;font-family:inherit;cursor:pointer}
        .btn.alt{background:#fff;color:var(--m2);border:1px solid var(--m2)}
        .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #efe6df}
        .item:last-child{border:0}.item small{color:#8d6e63;display:block}
        .item .x{background:none;border:0;color:#a1887f;font-size:18px;cursor:pointer}
        .r{color:var(--ok)}.d{color:var(--no)}
        .vazio{text-align:center;color:#8d6e63;padding:20px 0}
        nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
        nav button{flex:1;background:none;border:0;padding:10px 0;font-family:inherit;font-size:12px;color:#8d6e63;cursor:pointer}
        nav button span{display:block;font-size:20px}nav button.on{color:var(--m2);font-weight:bold}
        footer{text-align:center;font-size:12px;color:#8d6e63;margin:10px 0}
        #instalar{display:none}
    </style>
</head>
<body>
<header><img src="icon-192.png" alt=""><h1>Financeiro • Família Bembem</h1></header>
<main>
    <section id="t-inicio" class="tela on">
        <div class="card saldo">
            <small>Saldo atual</small>
            <div class="v"><span id="saldo">R$ 0,00</span><button id="olho" aria-label="Mostrar ou ocultar">👁</button></div>
            <div class="res"><div>Receitas<b class="rec" id="rec">R$ 0,00</b></div><div>Despesas<b class="des" id="des">R$ 0,00</b></div></div>
        </div>
        <div class="card"><b>Últimos lançamentos</b><div id="ult"></div></div>
        <button class="btn" id="instalar">📲 Instalar aplicativo</button>
    </section>

    <section id="t-novo" class="tela">
        <div class="card">
            <b>Novo lançamento</b>
            <label>Tipo</label>
            <select id="tipo"><option value="receita">Receita (entrada)</option><option value="despesa">Despesa (saída)</option></select>
            <label>Descrição</label><input id="desc" placeholder="Ex.: Mercado, Salário...">
            <label>Categoria</label>
            <select id="cat"><option>Moradia</option><option>Alimentação</option><option>Transporte</option><option>Saúde</option><option>Educação</option><option>Lazer</option><option>Dízimo e ofertas</option><option>Salário</option><option>Outros</option></select>
            <label>Valor (R$)</label><input id="valor" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0,00">
            <label>Data</label><input id="data" type="date">
            <button class="btn" id="salvar">Salvar</button>
        </div>
    </section>

    <section id="t-lista" class="tela">
        <div class="card"><b>Todos os lançamentos</b><div id="todos"></div></div>
    </section>

    <section id="t-exp" class="tela">
        <div class="card">
            <b>Exportar</b>
            <button class="btn" id="xlsx">📊 Baixar Excel</button>
            <button class="btn alt" id="pdf">📄 Baixar PDF</button>
        </div>
    </section>
    <footer>Financeira Família Bem-Bem</footer>
</main>

<nav>
    <button data-t="inicio" class="on"><span>🏠</span>Início</button>
    <button data-t="novo"><span>➕</span>Novo</button>
    <button data-t="lista"><span>📋</span>Lançamentos</button>
    <button data-t="exp"><span>⬇️</span>Exportar</button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<script>
    const $ = id => document.getElementById(id);
    const KEY = 'financeiro_lancamentos';
    const brl = n => n.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
    const dbr = s => s.split('-').reverse().join('/');
    let dados = [], oculto = false;

    function ler(){ try { dados = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ dados = []; } }
    function gravar(){ try { localStorage.setItem(KEY, JSON.stringify(dados)); } catch(e){ alert('Não foi possível salvar neste navegador.'); } }

    function linha(l){
        const sinal = l.tipo === 'receita' ? '+' : '−';
        return `<div class="item"><div>${esc(l.desc)}<small>${dbr(l.data)} • ${esc(l.cat)}</small></div>
  <div><b class="${l.tipo==='receita'?'r':'d'}">${sinal} ${brl(l.valor)}</b> <button class="x" data-id="${l.id}" title="Excluir">✕</button></div></div>`;
    }
    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function desenhar(){
        const rec = dados.filter(l=>l.tipo==='receita').reduce((a,l)=>a+l.valor,0);
        const des = dados.filter(l=>l.tipo==='despesa').reduce((a,l)=>a+l.valor,0);
        const m = v => oculto ? 'R$ ••••' : brl(v);
        $('saldo').textContent = m(rec-des); $('rec').textContent = m(rec); $('des').textContent = m(des);
        const ord = [...dados].sort((a,b)=> b.data.localeCompare(a.data) || b.id - a.id);
        $('ult').innerHTML = ord.slice(0,5).map(linha).join('') || '<div class="vazio">Nenhum lançamento ainda.</div>';
        $('todos').innerHTML = ord.map(linha).join('') || '<div class="vazio">Nenhum lançamento ainda.</div>';
    }

    document.addEventListener('click', e => {
        const x = e.target.closest('.x');
        if (x && confirm('Excluir este lançamento?')) { dados = dados.filter(l => l.id !== Number(x.dataset.id)); gravar(); desenhar(); }
    });

    document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
        document.querySelectorAll('nav button').forEach(n => n.classList.toggle('on', n === b));
        document.querySelectorAll('.tela').forEach(t => t.classList.toggle('on', t.id === 't-' + b.dataset.t));
        scrollTo(0,0);
    });
    $('olho').onclick = () => { oculto = !oculto; desenhar(); };

    $('data').value = new Date().toISOString().slice(0,10);
    $('salvar').onclick = () => {
        const desc = $('desc').value.trim(), valor = parseFloat($('valor').value), data = $('data').value;
        if (!desc || !(valor > 0) || !data) { alert('Preencha descrição, valor e data.'); return; }
        dados.push({id: Date.now(), tipo: $('tipo').value, desc, cat: $('cat').value, valor, data});
        gravar(); desenhar();
        $('desc').value = ''; $('valor').value = '';
        document.querySelector('nav button[data-t="inicio"]').click();
    };

    function tabela(){ return [...dados].sort((a,b)=>a.data.localeCompare(b.data)).map(l => [dbr(l.data), l.tipo === 'receita' ? 'Receita' : 'Despesa', l.desc, l.cat, l.valor]); }
    $('xlsx').onclick = () => {
        if (typeof XLSX === 'undefined') return alert('Biblioteca do Excel não carregou. Verifique a internet.');
        const ws = XLSX.utils.aoa_to_sheet([['Data','Tipo','Descrição','Categoria','Valor'], ...tabela()]);
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Lançamentos');
        XLSX.writeFile(wb, 'financeiro.xlsx');
    };
    $('pdf').onclick = () => {
        if (!window.jspdf) return alert('Biblioteca do PDF não carregou. Verifique a internet.');
        const doc = new window.jspdf.jsPDF();
        doc.text('Financeira Família Bem-Bem', 14, 16);
        doc.autoTable({ startY: 22, head: [['Data','Tipo','Descrição','Categoria','Valor']], body: tabela().map(r => [...r.slice(0,4), brl(r[4])]), headStyles: {fillColor: [93,64,55]} });
        doc.save('financeiro.pdf');
    };

    // Instalação (Chrome / Android)
    let evt = null;
    addEventListener('beforeinstallprompt', e => { e.preventDefault(); evt = e; $('instalar').style.display = 'block'; });
    $('instalar').onclick = async () => { if (!evt) return; evt.prompt(); await evt.userChoice; evt = null; $('instalar').style.display = 'none'; };
    addEventListener('appinstalled', () => { $('instalar').style.display = 'none'; });

    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));

    ler(); desenhar();
</script>
</body>
</html>
